<style>
    .m-page-info {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #f8fafc;
        padding: 12px 16px;
        margin-bottom: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        color: #475569;
    }
    .m-page-info .pi-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 0;
    }
    .m-page-info .pi-label {
        flex: 0 0 84px;
        font-weight: 600;
        color: #64748b;
    }
    .m-page-info .pi-value {
        color: #1e293b;
    }
    .m-page-info input.pi-parent-input {
        width: 100px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 13px;
        outline: none;
    }
    /* サーバーが管理する読み取り専用フィールドは淡色で示す */
    .m-page-info .pi-readonly {
        color: #94a3b8;
    }
</style>
<!-- 仮レイアウト（編集可能なのは親ページIDのみ。他はサーバー管理の読み取り専用） -->
<section class="m-page-info">
    <div class="pi-row"><span class="pi-label">ページID</span><span class="pi-value pi-readonly">${pageId}</span></div>
    <div class="pi-row"><span class="pi-label">親ページID</span><span class="pi-value"><input class="pi-parent-input" type="text" value="${parentId}" placeholder="（なし）"></span></div>
    <div class="pi-row"><span class="pi-label">作成日時</span><span class="pi-value pi-readonly">${createdAt}</span></div>
    <div class="pi-row"><span class="pi-label">作成者</span><span class="pi-value pi-readonly">${createdBy}</span></div>
    <div class="pi-row"><span class="pi-label">更新日時</span><span class="pi-value pi-readonly">${updatedAt}</span></div>
</section>
