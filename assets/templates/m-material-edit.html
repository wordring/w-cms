<div class="material-card-edit" style="border: 1px dashed #3b82f6; background-color: #f8fafc; padding: 12px; margin: 8px 0; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px;">
        <span style="font-weight: bold; color: #1e3a8a; font-size: 13px; display: flex; align-items: center; gap: 6px;">
            <span style="font-size: 14px;">🔧</span> 必要部材の定義
        </span>
        <button type="button" onclick="this.closest('m-material').remove(); if(window.updateHtmlPreview) window.updateHtmlPreview();" style="background: #ef4444; color: #fff; border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; transition: background 0.2s;" onmouseover="this.style.background='#dc2626'" onmouseout="this.style.background='#ef4444'">削除</button>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 12px;">
        <div style="flex: 2; min-width: 150px; display: flex; flex-direction: column; gap: 4px;">
            <span style="color: #475569; font-weight: 500;">部材名・加工名:</span>
            <input type="text" value="${itemName}" placeholder="例: シャフト用鋼材 (S45C)" style="border: 1px solid #cbd5e1; border-radius: 4px; padding: 4px 8px; outline: none; transition: border 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#cbd5e1'"
                   oninput="this.closest('m-material').setAttribute('item-name', this.value); if(window.updateHtmlPreview) window.updateHtmlPreview();">
        </div>
        <div style="flex: 1; min-width: 80px; display: flex; flex-direction: column; gap: 4px;">
            <span style="color: #475569; font-weight: 500;">単価 (原価):</span>
            <div style="display: flex; align-items: center; gap: 4px;">
                <input type="number" value="${cost}" style="width: 100%; border: 1px solid #cbd5e1; border-radius: 4px; padding: 4px 8px; outline: none;"
                       oninput="this.closest('m-material').setAttribute('cost', this.value); if(window.updateHtmlPreview) window.updateHtmlPreview();">
                <span style="color: #64748b;">円</span>
            </div>
        </div>
        <div style="flex: 1.5; min-width: 120px; display: flex; flex-direction: column; gap: 4px;">
            <span style="color: #475569; font-weight: 500;">仕入先・外注先:</span>
            <input type="text" value="${supplierName}" placeholder="例: 東邦金属工業" style="border: 1px solid #cbd5e1; border-radius: 4px; padding: 4px 8px; outline: none;"
                   oninput="this.closest('m-material').setAttribute('supplier-name', this.value); if(window.updateHtmlPreview) window.updateHtmlPreview();">
        </div>
        <div style="flex: 0.8; min-width: 60px; display: flex; flex-direction: column; gap: 4px;">
            <span style="color: #475569; font-weight: 500;">必要数:</span>
            <input type="number" value="${quantity}" style="border: 1px solid #cbd5e1; border-radius: 4px; padding: 4px 8px; outline: none;"
                   oninput="this.closest('m-material').setAttribute('quantity', this.value); if(window.updateHtmlPreview) window.updateHtmlPreview();">
        </div>
    </div>
</div>
