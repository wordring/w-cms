<div class="material-card-edit" style="border: 1px dashed #3b82f6; background-color: #f8fafc; padding: 12px; margin: 8px 0; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px;">
        <span style="font-weight: bold; color: #1e3a8a; font-size: 13px; display: flex; align-items: center; gap: 6px;">
            <span style="font-size: 14px;">🔧</span> 必要部材の定義
        </span>
        <button type="button" class="m-material-remove" data-remove>削除</button>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 12px;">
        <div style="flex: 2; min-width: 150px; display: flex; flex-direction: column; gap: 4px;">
            <span style="color: #475569; font-weight: 500;">部材名・加工名:</span>
            <input type="text" value="${itemName}" data-attr="item-name" placeholder="例: シャフト用鋼材 (S45C)" style="border: 1px solid #cbd5e1; border-radius: 4px; padding: 4px 8px; outline: none;">
        </div>
        <div style="flex: 1; min-width: 80px; display: flex; flex-direction: column; gap: 4px;">
            <span style="color: #475569; font-weight: 500;">単価 (原価):</span>
            <div style="display: flex; align-items: center; gap: 4px;">
                <input type="number" value="${cost}" data-attr="cost" style="width: 100%; border: 1px solid #cbd5e1; border-radius: 4px; padding: 4px 8px; outline: none;">
                <span style="color: #64748b;">円</span>
            </div>
        </div>
        <div style="flex: 1.5; min-width: 120px; display: flex; flex-direction: column; gap: 4px;">
            <span style="color: #475569; font-weight: 500;">仕入先・外注先:</span>
            <input type="text" value="${supplierName}" data-attr="supplier-name" placeholder="例: 東邦金属工業" style="border: 1px solid #cbd5e1; border-radius: 4px; padding: 4px 8px; outline: none;">
        </div>
        <div style="flex: 0.8; min-width: 60px; display: flex; flex-direction: column; gap: 4px;">
            <span style="color: #475569; font-weight: 500;">必要数:</span>
            <input type="number" value="${quantity}" data-attr="quantity" style="border: 1px solid #cbd5e1; border-radius: 4px; padding: 4px 8px; outline: none;">
        </div>
    </div>
</div>
