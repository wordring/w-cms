<div style="display:flex; align-items:center; justify-content:space-between; padding:6px 12px; border-bottom:1px solid #f1f5f9; font-size:13px; font-family:sans-serif;">
    <span style="font-family:monospace; color:#475569; font-weight:bold; width:120px;">[${itemId}]</span>
    <span style="flex-grow:1; color:#1e293b; font-weight:500;">${itemName}</span>
    <span style="margin:0 12px; color:#475569;">単価: ${priceDisplay} 円 × ${quantity}個</span>
    <span style="font-weight:bold; color:#0f172a; min-width:80px; text-align:right;">計: ${totalDisplay} 円</span>
    <span style="margin-left:16px; font-size:11px; font-weight:bold; color:${statusColor}; background:${statusBg}; padding:2px 8px; border-radius:12px; border: 1px solid ${statusColor}30;">${status}</span>
</div>
