<div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:#f8fafc; border:1px solid #e2e8f0; border-radius:4px; padding:8px; margin:4px 0;">
    <input type="text" value="${itemId}" data-attr="item-id" placeholder="部品コード" style="width:100px; padding:4px; border:1px solid #cbd5e1; border-radius:4px;">
    <input type="text" value="${itemName}" data-attr="item-name" placeholder="部品名" style="width:150px; padding:4px; border:1px solid #cbd5e1; border-radius:4px;">
    <input type="number" value="${price}" data-attr="price" placeholder="単価" style="width:80px; padding:4px; border:1px solid #cbd5e1; border-radius:4px;"> 円
    <input type="number" value="${quantity}" data-attr="quantity" placeholder="数量" style="width:50px; padding:4px; border:1px solid #cbd5e1; border-radius:4px;"> 個
    <select data-attr="status" style="padding:4px; border:1px solid #cbd5e1; border-radius:4px;">
        <option value="未着手" ${selectUnstarted}>未着手</option>
        <option value="加工中" ${selectProcessing}>加工中</option>
        <option value="検査中" ${selectInspecting}>検査中</option>
        <option value="納品済" ${selectFinished}>納品済</option>
    </select>
    <button type="button" data-remove style="background:#ef4444; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">削除</button>
</div>
