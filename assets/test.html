<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>w-cms Web Components テスト画面</title>
    <!-- 自作のWeb Componentsをロード -->
    <script src="web-components.js" defer></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .title {
            margin: 0;
            font-size: 24px;
            color: #0f172a;
        }
        /* モード切り替えスイッチのデザイン */
        .switch-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #007bff;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        .mode-label {
            font-weight: bold;
            font-size: 14px;
            color: #475569;
        }

        /* エディタ領域 */
        #editor-content {
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            background: #fafafa;
            min-height: 250px;
            margin-bottom: 30px;
        }

        /* リアルタイムHTMLプレビュー表示領域 */
        .preview-section {
            background-color: #1e293b;
            color: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            font-family: "Fira Code", Consolas, Monaco, monospace;
            font-size: 13px;
        }
        .preview-title {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 14px;
            color: #94a3b8;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        #html-preview {
            width: 100%;
            height: 200px;
            background: transparent;
            color: #38bdf8;
            border: none;
            outline: none;
            resize: vertical;
            font-family: inherit;
            font-size: inherit;
        }
        .tip {
            font-size: 12px;
            color: #64748b;
            margin-top: -15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 class="title">w-cms Web Components 動作テスト</h1>
        <div class="switch-container">
            <span class="mode-label" id="mode-text">閲覧モード</span>
            <label class="switch">
                <input type="checkbox" id="mode-toggle" onchange="toggleMode()">
                <span class="slider"></span>
            </label>
        </div>
    </div>
    
    <p class="tip">💡 スイッチをONにすると「編集モード」に切り替わり、テキストボックスが出現して値を直接編集できるようになります。値を変えると下の「保存されるHTML」がリアルタイムに書き換わります。</p>

    <!-- エディタコンテンツ領域（ここが保存対象のHTMLの中身になります） -->
    <div id="editor-content">
        <!-- 可変タグブロック -->
        <m-tag name="発注元" value="株式会社トーアスポーツマシーン"></m-tag>
        <m-tag name="希望納期" value="2026-06-10"></m-tag>
        <m-tag name="支払条件" value="通常"></m-tag>
        <m-tag name="自社担当" value="紀平"></m-tag>

        <h1>各マシーン用部品の調達と受注記録</h1>
        <p>以下の通り、取引先から発注書をいただき、材料見積もりを保管しました。</p>

        <!-- 添付ファイルブロック（顧客の発注書） -->
        <m-file src="sample_po.pdf" name="顧客発注書_原本.pdf" 
                tag="顧客の発注書" item-id="W120-P180-05-03A" price="1197" quantity="20"></m-file>

        <!-- 添付ファイルブロック（材料屋の見積もり） -->
        <m-file src="sample_material.pdf" name="アイアン素材見積書.pdf" 
                tag="材料屋・加工業者の見積もり" item-name="側板用鋼材" cost="500" supplier-name="東邦金属工業"></m-file>
    </div>

    <!-- リアルタイムに生成されるHTMLデータの表示（真のデータ） -->
    <div class="preview-section">
        <div class="preview-title">💾 リアルタイムで書き換わるHTMLソース（真のデータとしてファイルに保存される内容）</div>
        <textarea id="html-preview" readonly></textarea>
    </div>
</div>

<script>
    // モード切り替えの処理
    function toggleMode() {
        const toggle = document.getElementById('mode-toggle');
        const modeText = document.getElementById('mode-text');
        const editor = document.getElementById('editor-content');

        if (toggle.checked) {
            // 編集モード
            document.body.setAttribute('edit-mode', '');
            modeText.innerText = "編集モード";
            modeText.style.color = "#007bff";
        } else {
            // 閲覧モード
            document.body.removeAttribute('edit-mode');
            modeText.innerText = "閲覧モード";
            modeText.style.color = "#475569";
        }

        // Web Componentsの再描画を促すためにコンポーネント内のrenderメソッドを再実行
        const components = editor.querySelectorAll('m-tag, m-file');
        components.forEach(c => {
            if (typeof c.render === 'function') {
                c.render();
            }
        });

        // プレビューの更新
        updateHtmlPreview();
    }

    // HTMLソースコードのリアルタイムプレビューを生成する処理
    function updateHtmlPreview() {
        const container = document.getElementById('editor-content');
        let output = "";

        // エディタ内の要素を順番にシリアライズする
        const children = container.children;
        for (let i = 0; i < children.length; i++) {
            const child = children[i];
            const tagName = child.tagName.toLowerCase();

            if (tagName === 'm-tag') {
                const name = child.getAttribute('name') || '';
                const value = child.getAttribute('value') || '';
                output += `<m-tag name="${name}" value="${value}"></m-tag>\n`;
            } else if (tagName === 'm-file') {
                const src = child.getAttribute('src') || '';
                const name = child.getAttribute('name') || '';
                const tag = child.getAttribute('tag') || '';
                let extra = '';
                
                if (tag === '顧客の発注書' || tag === '弊社の見積もり') {
                    extra = ` price="${child.getAttribute('price') || '0'}" quantity="${child.getAttribute('quantity') || '1'}"`;
                } else if (tag === '材料屋・加工業者の見積もり' || tag === '弊社の発注書') {
                    extra = ` cost="${child.getAttribute('cost') || '0'}"`;
                }
                
                output += `<m-file src="${src}" name="${name}" tag="${tag}"${extra}></m-file>\n`;
            } else if (tagName === 'h1' || tagName === 'h2' || tagName === 'h3' || tagName === 'p') {
                // 標準HTMLタグはそのままテキストコンテンツを出力
                output += `<${tagName}>${child.innerText}</${tagName}>\n`;
            }
        }

        document.getElementById('html-preview').value = output.trim();
    }

    // 初回読み込み時の初期表示
    window.onload = function() {
        updateHtmlPreview();
    };
</script>

</body>
</html>
