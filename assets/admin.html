<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>w-cms 管理コンソール</title>
<!-- スタイル・スクリプトは外部ファイル（＝CSPの self）。2026-08-06 にインラインから切り出し -->
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body>
  <a class="back" href="/">← エディタに戻る</a>
  <h1>⚙ w-cms 管理コンソール</h1>
  <div id="whoami"></div>
  <div id="denied" class="denied is-hidden">このページは管理者のみ利用できます。</div>

  <div id="console" class="is-hidden">
    <!-- ユーザー -->
    <h2>ユーザー</h2>
    <div class="card">
      <table id="users-table"><thead><tr><th>ユーザー名</th><th>管理者</th><th>主グループ</th><th>状態</th><th>操作</th></tr></thead><tbody></tbody></table>
      <div class="row row--gap-lg">
        <strong>新規作成:</strong>
        <input id="nu-name" placeholder="ユーザー名">
        <input id="nu-pass" placeholder="パスワード" type="password">
        <input id="nu-group" placeholder="主グループ(任意)">
        <label><input id="nu-admin" type="checkbox"> 管理者</label>
        <button id="nu-create">作成</button>
        <span id="nu-msg" class="msg"></span>
      </div>
    </div>

    <!-- グループ -->
    <h2>グループ</h2>
    <div class="card">
      <div id="groups-list"></div>
      <div class="row row--gap-md">
        <strong>グループ作成:</strong>
        <input id="ng-name" placeholder="グループ名">
        <button id="ng-create">作成</button>
        <span id="ng-msg" class="msg"></span>
      </div>
      <div class="row row--gap-sm">
        <strong>メンバー操作:</strong>
        <input id="gm-user" placeholder="ユーザー名">
        <input id="gm-group" placeholder="グループ名">
        <button id="gm-add">追加</button>
        <button class="sub" id="gm-remove">削除</button>
        <span id="gm-msg" class="msg"></span>
      </div>
    </div>

    <!-- メンテナンス -->
    <h2>メンテナンス</h2>
    <div class="card">
      <div class="row">
        <button id="rebuild-btn" class="danger-btn">🔄 データベース再構築</button>
        <span class="hint">HTMLファイル（<code>data/master</code>）を正としてDBインデックスを完全に作り直します。</span>
        <span id="rebuild-msg" class="msg"></span>
      </div>
    </div>

    <!-- 監査ログ -->
    <h2>監査ログ（最近200件）</h2>
    <div class="card">
      <button class="sub" id="audit-reload">再読み込み</button>
      <table id="audit-table"><thead><tr><th>日時(UTC)</th><th>ユーザー</th><th>操作</th><th>対象</th></tr></thead><tbody></tbody></table>
    </div>
  </div>

<script src="/assets/admin.js"></script>
</body>
</html>
